<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff9800" />
  <title>Học Vui cùng Bé Yêu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐼</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- MÀN HÌNH CHÍNH -->
  <div id="screen-menu" class="screen active">
    <header class="app-header">
      <div class="app-header-top">
        <button class="menu-btn" id="menuToggle" aria-label="Chọn mục học">☰</button>
        <div class="mascot-wrap" id="menuMascot"></div>
        <div class="title-wrap">
          <h1>Học Vui cùng Bé Yêu</h1>
          <p id="appSubtitle">Toán tư duy cùng Gấu KIKI 🐼</p>
        </div>
        <button class="profile-btn" id="profileBtn" title="Hồ sơ học tập" aria-label="Hồ sơ học tập">
          <span class="pf-emoji" id="pfEmoji">🐼</span>
          <span class="pf-name" id="pfName">Bé yêu</span>
        </button>
        <button class="sound-toggle" id="soundToggle" title="Bật/tắt âm thanh">🔊</button>
      </div>
      <nav class="subject-tabs" id="subjectTabs" aria-label="Chọn mục học">
        <button class="subject-tab active" id="tabMath" data-sub="math"><span class="st-ic">🧠</span> Toán tư duy</button>
        <button class="subject-tab" id="tabEn" data-sub="en"><span class="st-ic">🔤</span> Tiếng Anh cho bé</button>
      </nav>
    </header>

    <div class="menu-layout">
      <aside class="sidebar" id="sidebar" aria-label="Chọn mục học">
        <div class="sidebar-title" id="sidebarTitle">📚 Chọn tập sách</div>
        <div id="volList"></div>
      </aside>
      <div class="scrim" id="scrim"></div>
      <main id="menuBody" class="menu-body">
        <!-- các thẻ bài học được sinh bằng JS -->
      </main>
    </div>

    <footer class="app-footer">
      <span>Dựa theo bộ sách <b>“Phiếu luyện Toán tư duy cùng Gấu KIKI”</b> — Bé chơi lại bao nhiêu lần cũng được! 💛</span>
    </footer>
  </div>

  <!-- MÀN HÌNH CHƠI -->
  <div id="screen-play" class="screen">
    <header class="play-header">
      <button class="btn-back" id="btnBack" aria-label="Quay lại">‹</button>
      <div class="play-title" id="playTitle">Bài học</div>
      <button class="btn-repeat" id="btnSpeak" aria-label="Đọc lại">🔁</button>
    </header>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="stars-row" id="starsRow"></div>
    <main class="play-body" id="playBody"></main>
    <div class="feedback-layer" id="feedback"></div>
  </div>

  <!-- HỒ SƠ HỌC TẬP + SAO LƯU -->
  <div class="modal-overlay" id="profileModal" hidden>
    <div class="modal-card" id="profileCard"></div>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden />

  <script src="js/store.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/art.js"></script>
  <script src="js/lessons-t1.js"></script>
  <script src="js/lessons-t2.js"></script>
  <script src="js/lessons.js"></script>
  <script src="js/lessons-t4.js"></script>
  <script src="js/lessons-t5.js"></script>
  <script src="js/english-data.js"></script>
  <script src="js/english.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
